<style>

:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.vid:focus,.vid:focus-visible,#vd:focus-visible,#mp:focus-visible,#mp video:focus,#mp video:focus-visible,.plr video:focus-visible{outline:none}#mp button:focus:not(:focus-visible){outline:none}

.ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}.ul li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}

rder:0;border-radius:50%;background:none;color:var(--mut);font-size:16px}
.vid{flex:1;min-height:0;margin-top:12px;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.vid iframe,.vid video{width:100%;height:100%;border:0}
.plr{max-width:1100px;height:min(100%,720px);justify-content:flex-start;background:#0e0e13;border:1px solid var(--line)}

.pw{position:relative}

.rw{padding-top:44px}.rh{padding-bottom:18px}.rh h2{font-size:26px}.rail{gap:18px;padding-bottom:14px}.hero{margin-bottom:8px}

.dt{max-height:calc(100vh - 40px);overflow:auto}

html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}

function etApply(m){try{const c=JSON.parse(localStorage.getItem('pel_et2:'+m.t)||'null');if(c&&m.eps)for(const i in c){const e=m.eps[i];if(e&&ETG.test(e.t))e.t=c[i]}}catch(e){}}
async function epNames(m,id){if(!m.eps||!m.eps.some(e=>ETG.test(e.t)))return;
 const tv=await api('/tv/'+id),ss=(tv.seasons||[]).filter(z=>z.season_number>0&&z.episode_count>0).sort((a,b)=>a.season_number-b.season_number);if(!ss.length)return;

 let r=0;const L=[];m.eps.forEach((e,i)=>{if(e.x||ETX.test(e.t))return;r++;const d=(String(e.t).match(/\d+/)||[])[0];L.push([i,+d||e.n||r])});
 if(!L.length||Math.abs(T.length-Math.max(...L.map(z=>z[1])))>2)return;

const tvMeta=async m=>{try{etApply(m);let x=null;for(const q of String(m.tv).split('|')){let d=m.ty?await api('/search/tv',{query:q,first_air_date_year:m.ty}).catch(()=>({})):{};x=(d.results||[])[0];if(!x){d=await api('/search/tv',{query:q});x=(d.results||[])[0]}if(x)break}if(!x)return;m.p=x.poster_path||'';m.b=x.backdrop_path||'';m.r=x.vote_average?x.vote_average.toFixed(1):'';m.ol=m.ol||x.original_language||'';m.y=(x.first_air_date||'').slice(0,4);m.o=m.o||x.overview||'';if(S.p&&['inicio','categorias','lista'].includes(cur))render();epNames(m,x.id).catch(()=>{})}catch(e){}};
S.custom.filter(m=>m.tv&&!m.mq).forEach(tvMeta);

<script>
/* ===== ventanas de reproducción movibles =====
   - Mini reproductor (#mp): arrástralo desde cualquier parte (menos los botones). Recuerda dónde lo dejaste.
   - Ventana grande (.plr): arrástrala desde el título. Doble clic en el título la vuelve al centro.
   - Doble clic en la barra del mini reproductor lo devuelve a su esquina. */
(()=>{
const q=s=>document.querySelector(s),
 clamp=(v,a,b)=>Math.min(Math.max(v,a),Math.max(a,b)),
 mob=matchMedia('(max-width:760px)'),
 LS='pel_mp_pos';
let mpPos=null;try{mpPos=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
let po={x:0,y:0},D=null,jd=false;

/* mini reproductor */
function mpPlace(x,l,t){
 const r=x.getBoundingClientRect(),
  L=clamp(l,8,innerWidth-r.width-8),T=clamp(t,8,innerHeight-r.height-8);
 x.style.left=L+'px';x.style.top=T+'px';x.style.right='auto';x.style.bottom='auto';
 return{l:L,t:T}}
function mpApply(x){if(mpPos&&typeof mpPos.l==='number'&&typeof mpPos.t==='number')mpPlace(x,mpPos.l,mpPos.t)}
function mpReset(x){x.style.left=x.style.top=x.style.right=x.style.bottom='';mpPos=null;try{localStorage.removeItem(LS)}catch(e){}}

/* ventana grande */
function plrApply(p){
 if(mob.matches){p.style.left=p.style.top='';return}
 p.style.left=po.x+'px';p.style.top=po.y+'px';
 const r=p.getBoundingClientRect();
 const dx=clamp(r.left,-(r.width-120),innerWidth-120)-r.left,
  dy=clamp(r.top,0,innerHeight-56)-r.top;
 if(dx||dy){po.x+=dx;po.y+=dy;p.style.left=po.x+'px';p.style.top=po.y+'px'}}

/* arrastre (ratón y táctil) */
document.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const t=e.target;if(!t||!t.closest)return;
 const x=t.closest('#mp');
 if(x&&!t.closest('button')){
  const r=x.getBoundingClientRect();
  D={k:'mp',el:x,id:e.pointerId,sx:e.clientX,sy:e.clientY,l:r.left,t:r.top,m:false};return}
 const h=t.closest('.plr .h3');
 if(h&&!mob.matches){
  const p=h.closest('.plr'),r=p.getBoundingClientRect();
  D={k:'plr',el:p,id:e.pointerId,sx:e.clientX,sy:e.clientY,l:r.left,t:r.top,w:r.width,ox:po.x,oy:po.y,m:false}}
});
document.addEventListener('pointermove',e=>{
 if(!D||e.pointerId!==D.id)return;
 const dx=e.clientX-D.sx,dy=e.clientY-D.sy;
 if(!D.m){if(Math.hypot(dx,dy)<5)return;D.m=true;D.el.classList.add('dragging');try{D.el.setPointerCapture(D.id)}catch(_){}}
 if(D.k==='mp'){mpPlace(D.el,D.l+dx,D.t+dy)}
 else{
  const nl=clamp(D.l+dx,-(D.w-120),innerWidth-120),nt=clamp(D.t+dy,0,innerHeight-56);
  po.x=D.ox+(nl-D.l);po.y=D.oy+(nt-D.t);
  D.el.style.left=po.x+'px';D.el.style.top=po.y+'px'}
 e.preventDefault()});
const fin=e=>{
 if(!D||e.pointerId!==D.id)return;
 const d=D;D=null;
 if(!d.m)return;
 d.el.classList.remove('dragging');
 try{d.el.releasePointerCapture(d.id)}catch(_){}
 if(d.k==='mp'){const r=d.el.getBoundingClientRect();mpPos={l:r.left,t:r.top};try{localStorage.setItem(LS,JSON.stringify(mpPos))}catch(_){}}
 jd=true;setTimeout(()=>{jd=false},60)};
document.addEventListener('pointerup',fin);
document.addEventListener('pointercancel',fin);
/* si se arrastró, no dispares el clic de pausa/play del video */
document.addEventListener('click',e=>{if(jd){e.stopPropagation();e.preventDefault();jd=false}},true);

/* dobles clics para volver a la posición original */
document.addEventListener('dblclick',e=>{
 const t=e.target;if(!t||!t.closest)return;
 if(t.closest('#mp .mp-i')&&!t.closest('button')){mpReset(t.closest('#mp'));return}
 const h=t.closest('.plr .h3');
 if(h){po={x:0,y:0};plrApply(h.closest('.plr'))}});

/* aplicar posiciones cuando aparece una ventana nueva (se recrean en cada reproducción) */
new MutationObserver(()=>{const x=q('#mp');if(x&&!x.dataset.dg){x.dataset.dg=1;x.title='';mpApply(x)}}).observe(document.body,{childList:true});
const ov=q('#ov');
if(ov)new MutationObserver(()=>{const p=ov.querySelector('.plr');if(p&&!p.dataset.dg){p.dataset.dg=1;const h=p.querySelector('.h3');if(h)h.title='Arrastra para mover · doble clic para centrar';plrApply(p)}}).observe(ov,{childList:true});

/* mantenerlas dentro de la pantalla al girar o cambiar el tamaño */
addEventListener('resize',()=>{
 const x=q('#mp');if(x&&x.style.left){const r=x.getBoundingClientRect();mpPlace(x,r.left,r.top)}
 const p=q('.plr');if(p)plrApply(p)});
mob.addEventListener&&mob.addEventListener('change',()=>{const p=q('.plr');if(p)plrApply(p)});
})();
</script>

<script>
/* PELICULON PWA: instalación y actualización automática */
(()=>{
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  let installPrompt=null;
  const css=document.createElement('style');
  css.textContent=`
    #pwa-tools{position:fixed;right:14px;top:calc(58px + env(safe-area-inset-top,0px));z-index:40;display:flex;gap:8px;align-items:center}
    #pwa-tools button{min-height:38px;padding:0 13px;border:1px solid #39343a;border-radius:99px;background:#17171d;color:#fff;font:700 12px 'DM Sans',sans-serif;box-shadow:0 5px 18px #0008}
    #pwa-tools button.primary{background:#e8b84a;color:#0b0b0f;border-color:#e8b84a}
    #pwa-update{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:50;display:none;align-items:center;gap:12px;max-width:520px;margin:auto;padding:13px 14px;border:1px solid #4b4024;border-radius:15px;background:#17150f;color:#fff;box-shadow:0 12px 36px #000b;font:600 13px 'DM Sans',sans-serif}
    #pwa-update.show{display:flex}#pwa-update span{flex:1;line-height:1.4}#pwa-update button{border:0;border-radius:99px;padding:10px 14px;background:#e8b84a;color:#0b0b0f;font-weight:800}
    @media(min-width:761px){#pwa-update{bottom:18px}#pwa-tools{top:14px}}
  `;
  document.head.appendChild(css);
  const tools=document.createElement('div');tools.id='pwa-tools';
  tools.innerHTML='<button id="pwa-install" class="primary" hidden>＋ Instalar app</button>';
  document.body.appendChild(tools);
  const installBtn=document.getElementById('pwa-install');
  const update=document.createElement('div');update.id='pwa-update';
  update.innerHTML='<span>Hay una nueva versión de PELICULON disponible.</span><button id="pwa-reload">Actualizar</button>';
  document.body.appendChild(update);

  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();installPrompt=e;
    if(!isStandalone())installBtn.hidden=false;
  });
  installBtn.addEventListener('click',async()=>{
    if(!installPrompt)return;
    installPrompt.prompt();
    try{await installPrompt.userChoice}catch(e){}
    installPrompt=null;installBtn.hidden=true;
  });
  window.addEventListener('appinstalled',()=>{installBtn.hidden=true;installPrompt=null;});

  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshing)return;
      refreshing=true;
      // El controlador nuevo ya está activo; recargar muestra los archivos nuevos.
      location.reload();
    });
    navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
      const announce=()=>{if(reg.waiting && navigator.serviceWorker.controller)update.classList.add('show');};
      announce();
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker)return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed' && navigator.serviceWorker.controller)update.classList.add('show');
        });
      });
      document.getElementById('pwa-reload').addEventListener('click',()=>{
        if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
        else location.reload();
      });
      const check=()=>{if(navigator.onLine)reg.update().catch(()=>{});};
      check();
      setInterval(check,60*60*1000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
    }).catch(err=>console.warn('No se pudo activar el modo app:',err));
  }
})();
</script>
